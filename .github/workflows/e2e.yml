name: E2E (real DeepSeek API)

# A maintainer starts this workflow only when real-provider coverage is needed.
# The key remains scoped to the preflight and test steps; a missing secret is a
# configuration error, not a skipped success.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Install bubblewrap (unrestrict userns)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            || echo "apparmor userns knob absent — the functional probe decides"

      - name: Preflight (require DEEPSEEK API key)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::error::DEEPSEEK_API_KEY is empty. The e2e suite would self-skip and"
            echo "::error::report a false green. Configure the DEEPSEEK_API_KEY_EXTERNAL repository secret."
            exit 1
          fi
          echo "DEEPSEEK_API_KEY present."

      - name: Build (lib for the e2e example bins)
        run: pnpm run build

      - name: E2E tests (real DeepSeek API)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          DSH_E2E_MAX_WORKERS: '14'
          DSH_EXAMPLE_MODE: lib
        run: pnpm run test:e2e
